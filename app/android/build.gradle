buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        // Ne pas monter sans monter React Native : le plugin Gradle de RN 0.75.4
        // attend KotlinTopLevelExtension en classe, or Kotlin >= 2.1 en fait une
        // interface ("Found interface ..., but class was expected").
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}
