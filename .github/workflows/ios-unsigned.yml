name: iOS unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ios-unsigned.yml'
  push:
    tags:
      - 'ios-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and package the unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.artifact.outputs.version }}
      build_number: ${{ steps.artifact.outputs.build_number }}
      min_os: ${{ steps.validate.outputs.min_os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` efface et reextrait node_modules a chaque run : chaque source
      # de React Native repart avec une date de modification neuve, et llbuild
      # considere alors tous les objets deja compiles comme perimes. Le cache
      # d'objets ci-dessous ne servait donc a rien. Restaurer node_modules par
      # tar preserve les dates et rend la compilation reellement incrementale.
      # La cle couvre les patchs : patch-package s'execute en postinstall, un
      # patch modifie doit produire un node_modules different.
      - name: Cache the installed JavaScript dependencies
        id: node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/node_modules
          key: ios-node-modules-${{ hashFiles('app/package-lock.json', 'app/patches/**') }}

      - name: Install JavaScript dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: app
        run: npm ci

      - name: Build the injected userscript
        working-directory: app
        run: npm run build:userscript

      # L'identite de l'artefact vient d'app.json, jamais d'une saisie humaine :
      # une valeur hors format casserait le nom de l'artefact et la release.
      - name: Resolve the artifact version
        id: artifact
        working-directory: app
        run: |
          VERSION="$(node -p "require('./app.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "app.json version is not a bare semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BUILD_NUMBER="$(node -p "require('./app.json').buildNumber")"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "app.json buildNumber is not a bare integer: $BUILD_NUMBER" >&2
            exit 1
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # Les Pods et les objets deja compilees dominent la duree du job. La cle
      # suit le Podfile, le lock npm et les patchs : tout changement de
      # dependance invalide le cache, le reste du temps la compilation redevient
      # incrementale. Le SHA en fin de cle fait tourner l'entree a chaque commit,
      # les restore-keys rattrapant la plus recente par prefixe.
      #
      # Attention au cloisonnement GitHub : une entree ecrite depuis une branche
      # n'est lisible que par cette branche et ses descendantes. Seules celles
      # ecrites sur la branche par defaut servent a tout le monde, d'ou les
      # "Cache not found" des premiers runs sur main apres une PR.
      #
      # `app/ios/build/generated` contient la sortie du codegen React Native :
      # sans elle, pod install la regenere et les specs recompilent pour rien.
      - name: Cache CocoaPods and build objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/ios/Pods
            app/ios/build/generated
            app/build/dd-simulator
            app/build/dd
          key: ios-${{ hashFiles('app/ios/Podfile', 'app/package-lock.json', 'app/patches/**') }}-${{ github.sha }}
          restore-keys: |
            ios-${{ hashFiles('app/ios/Podfile', 'app/package-lock.json', 'app/patches/**') }}-
            ios-

      # Pas de --deployment : le Podfile.lock est un resultat du run, publie en
      # artefact pour rendre la resolution auditable, pas une entree figee.
      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install

      - name: Upload the resolved Podfile.lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Movix-Podfile-lock-${{ steps.artifact.outputs.version }}-${{ github.run_number }}
          path: app/ios/Podfile.lock
          if-no-files-found: error

      - name: Run the native and bridge contracts
        working-directory: app
        run: |
          npm run test:ios-contract
          node --test \
            tests/unsignedIpaWorkflow.test.mjs \
            tests/mediaProxyRouting.test.mjs \
            tests/mediaProxyRuntime.test.mjs \
            tests/mediaProxyBridgeContract.test.mjs

      # L'image du runner change de versions d'iOS sans preavis : figer un
      # "OS=" precis casse le job des qu'Apple retire un simulateur.
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          UDID="$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' \
            | head -n 1)"
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # COMPILER_INDEX_STORE_ENABLE=NO : l'index store ne sert qu'a l'editeur
      # Xcode, personne ne l'ouvre sur un runner, et il coute une passe d'index
      # sur chaque unite de traduction.
      - name: Compile for the simulator
        working-directory: app/ios
        run: |
          xcodebuild build \
            -workspace Movix.xcworkspace \
            -scheme Movix \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/app/build/dd-simulator" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # MARKETING_VERSION et CURRENT_PROJECT_VERSION sont imposés depuis
      # app.json : c'est la seule source de vérité des versions. Sans cela le
      # pbxproj peut dériver et l'IPA porterait une autre version que celle
      # annoncée par la source AltStore/SideStore — les stores proposeraient
      # alors la « mise à jour » en boucle.
      - name: Compile the unsigned device binary
        working-directory: app/ios
        run: |
          xcodebuild build \
            -workspace Movix.xcworkspace \
            -scheme Movix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/app/build/dd" \
            MARKETING_VERSION=${{ steps.artifact.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.artifact.outputs.build_number }} \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS=

      - name: Package the unsigned IPA
        working-directory: app
        env:
          IOS_APP_PATH: build/dd/Build/Products/Release-iphoneos/Movix.app
          IOS_OUTPUT_DIR: build/unsigned-ipa
        run: bash scripts/package-unsigned-ios.sh

      # min_os alimente la source AltStore/SideStore : la valeur vient du
      # binaire réellement compilé, pas d'une constante à maintenir à la main.
      - name: Validate the unsigned IPA
        id: validate
        working-directory: app
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/Movix.app"
          PAYLOAD="build/unsigned-ipa/Payload/Movix.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "${{ steps.artifact.outputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "${{ steps.artifact.outputs.build_number }}"
          lipo -archs "$APP/Movix" | tr ' ' '\n' | grep -qw arm64
          test ! -e "$PAYLOAD/_CodeSignature"
          test ! -e "$PAYLOAD/embedded.mobileprovision"
          unzip -t build/unsigned-ipa/Movix-unsigned.ipa
          (cd build/unsigned-ipa && shasum -a 256 -c Movix-unsigned.ipa.sha256)

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Movix-unsigned-${{ steps.artifact.outputs.version }}-${{ github.run_number }}
          path: |
            app/build/unsigned-ipa/Movix-unsigned.ipa
            app/build/unsigned-ipa/Movix-unsigned.ipa.sha256
          if-no-files-found: error

  # Seul ce job ecrit dans le depot, et il ne consomme que l'artefact produit
  # au-dessus : rien de ce qui est compile ne tourne avec un jeton en ecriture.
  release:
    name: Publish the tagged unsigned IPA
    needs: build
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Checkout avant le téléchargement : actions/checkout nettoie le workspace
      # et effacerait dist/. La branche par défaut, pas le tag, parce que ce job
      # y ajoute un commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Movix-unsigned-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Verify the checksum before publishing
        working-directory: dist
        run: shasum -a 256 -c Movix-unsigned.ipa.sha256

      # Les sources des stores sont régénérées à chaque publication : une pour
      # AltStore et SideStore (même format JSON pour les deux), une pour
      # Scarlet, qui a le sien. L'URL de téléchargement pointe sur l'IPA
      # commitée dans le dépôt : IPA et sources partent dans le même commit,
      # donc tous les fichiers servis par raw.githubusercontent restent
      # toujours cohérents entre eux, taille comprise.
      - name: Generate the AltStore, SideStore and Scarlet sources
        env:
          IOS_SOURCE_VERSION: ${{ needs.build.outputs.version }}
          IOS_SOURCE_BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          IOS_SOURCE_MIN_OS: ${{ needs.build.outputs.min_os }}
          IOS_SOURCE_IPA_PATH: dist/Movix-unsigned.ipa
          IOS_SOURCE_DATE: ${{ github.event.head_commit.timestamp }}
          IOS_SOURCE_DOWNLOAD_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/app/movix-ios-unsigner.ipa
          IOS_SOURCE_ICON_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/app/ios/Movix/Images.xcassets/AppIcon.appiconset/icon-1024.png
          IOS_SOURCE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          IOS_SOURCE_OUTPUT: app/movix-ios-source.json
          IOS_SCARLET_OUTPUT: app/movix-scarlet-source.json
        run: node app/scripts/generate-ios-source.mjs

      # L'IPA vit dans le dépôt à côté de movix-android.apk, pour être
      # téléchargeable en direct depuis raw.githubusercontent comme l'APK.
      # Seuls ces chemins sont indexés : dist/ reste non suivi.
      - name: Commit the IPA next to the Android build
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          install -m 644 dist/Movix-unsigned.ipa app/movix-ios-unsigner.ipa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/movix-ios-unsigner.ipa app/movix-ios-source.json app/movix-scarlet-source.json
          if git diff --cached --quiet; then
            echo "IPA et sources identiques à celles déjà publiées, rien à committer."
            exit 0
          fi
          git commit -F - <<EOF
          build(ios): publier l'IPA non signée ${{ needs.build.outputs.version }}

          Générée par le workflow ios-unsigned depuis le tag ${GITHUB_REF_NAME}.
          L'archive est identique à celle attachée à la release et a été
          vérifiée par son empreinte SHA-256 avant d'être indexée.

          Les sources des stores (app/movix-ios-source.json pour AltStore et
          SideStore, app/movix-scarlet-source.json pour Scarlet) sont
          régénérées dans le même commit : version, taille et URL restent
          cohérentes avec l'IPA servie par raw.githubusercontent.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          # Une autre exécution peut avoir avancé la branche entre le checkout
          # et le push : on rejoue le commit sur la nouvelle tête.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
            git pull --rebase origin "${DEFAULT_BRANCH}"
          done
          echo "Impossible de pousser l'IPA sur ${DEFAULT_BRANCH}" >&2
          exit 1

      - name: Create the release
        working-directory: dist
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            Movix-unsigned.ipa \
            Movix-unsigned.ipa.sha256 \
            --title "Movix ${{ needs.build.outputs.version }} (iOS, non signee)" \
            --notes "IPA non signee. Son installation est impossible tant qu'un utilisateur ne l'a pas signee par ses propres moyens. Verifiez l'archive avec: shasum -a 256 -c Movix-unsigned.ipa.sha256 — Source AltStore/SideStore : https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/app/movix-ios-source.json — Source Scarlet : https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/app/movix-scarlet-source.json"
